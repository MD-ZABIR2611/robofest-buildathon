<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Issued prescriptions · MediCare+</title>

  <style data-medicare>
:root {
  --primary: #0d9488;
  --primary-hover: #0f766e;
  --accent-light: #ccfbf1;
  --bg: #f8fafc;
  --surface: #ffffff;
  --heading: #0f172a;
  --body: #475569;
  --muted: #64748b;
  --line: #e2e8f0;
  --danger: #b91c1c;
  --warn: #b45309;
  --ok: #047857;
  --info: #0369a1;
  --shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
  --radius: 16px;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}

*,
*::before,
*::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--sans);
  color: var(--body);
  background: var(--bg);
  line-height: 1.55;
}
img { max-width: 100%; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4, .brand-mark {
  font-family: var(--sans);
  color: var(--heading);
  letter-spacing: -0.02em;
  font-weight: 700;
}

.skip {
  position: absolute; left: -999px; top: 0;
}
.skip:focus { left: 12px; top: 12px; background: #fff; padding: 8px 12px; z-index: 30; }

.topnav {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 14px 28px;
  border-bottom: 1px solid var(--line);
  background: #fff;
  position: sticky; top: 0; z-index: 20;
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--heading); text-decoration: none; }
.brand:hover { text-decoration: none; }
.logo {
  width: 34px; height: 34px; border-radius: 10px;
  background: var(--primary); color: #fff;
  display: grid; place-items: center;
}
.brand-mark { font-size: 1.1rem; margin: 0; }
.nav-links { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.nav-links a { color: var(--muted); font-size: 0.95rem; font-weight: 500; }
.nav-links a.active, .nav-links a:hover { color: var(--heading); text-decoration: none; }

.btn, .btn-secondary, .btn-ghost, .btn-danger, .btn-outline {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 12px; padding: 10px 16px; border: 1px solid transparent;
  cursor: pointer; text-decoration: none; font-weight: 600;
  transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
}
.btn {
  background: var(--primary); color: #fff;
  box-shadow: 0 4px 14px rgba(13, 148, 136, 0.25);
}
.btn:hover { background: var(--primary-hover); transform: translateY(-1px); text-decoration: none; color: #fff; }
.btn-outline, .btn-secondary {
  background: transparent; color: var(--primary); border-color: var(--primary);
}
.btn-outline:hover, .btn-secondary:hover {
  background: var(--accent-light); transform: translateY(-1px); text-decoration: none;
}
.btn-ghost { background: transparent; color: var(--heading); }
.btn-danger { background: #fef2f2; color: var(--danger); border-color: #fecaca; }
.btn[disabled] { opacity: 0.55; cursor: not-allowed; transform: none; }

.hero, .page, .narrow, .auth-wrap, .section {
  width: min(1120px, calc(100% - 32px));
  margin-left: auto; margin-right: auto;
}
.hero {
  display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 40px; padding: 64px 0 48px;
}
.hero-card h2 { margin-top: 8px; }
.logo {
  box-shadow: 0 8px 20px rgba(13, 148, 136, 0.28);
}
.card:hover, .item:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
}
.card, .item { transition: transform 0.18s ease, box-shadow 0.18s ease; }
.site-nav-toggle {
  display: none;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 10px;
  padding: 8px 12px;
  font-weight: 600;
  cursor: pointer;
}
.footer {
  width: min(1120px, calc(100% - 32px));
  margin: 40px auto 24px;
  padding: 20px 0;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 0.9rem;
}
.kicker {
  text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.72rem;
  color: var(--primary); font-weight: 700;
}
.hero h1 { font-size: clamp(2.1rem, 5vw, 3.4rem); line-height: 1.1; margin: 8px 0 16px; }
.lede { color: var(--muted); font-size: 1.05rem; max-width: 52ch; }
.hero-card, .card, .panel, .item {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.hero-card { padding: 1.5rem; }
.grid-3, .grid-2, .cards { display: grid; gap: 16px; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.card { padding: 1.5rem; }
.card h3 { margin: 8px 0; }
.muted { color: var(--muted); }
.tiny { font-size: 0.82rem; color: var(--muted); }
.section { margin-bottom: 48px; }

.layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; background: var(--bg); }
.sidebar {
  background: #fff;
  color: var(--heading);
  padding: 22px 14px;
  display: flex; flex-direction: column; gap: 6px;
  border-right: 1px solid var(--line);
  position: sticky; top: 0; height: 100vh;
}
.sidebar a {
  color: var(--body); text-decoration: none; padding: 10px 12px; border-radius: 12px;
  display: flex; gap: 10px; align-items: center; font-weight: 500;
}
.sidebar a.active, .sidebar a:hover { background: var(--accent-light); color: var(--primary); text-decoration: none; }
.sidebar .brand-mark { color: var(--heading); }
.workspace { min-width: 0; background: var(--bg); }
.app-top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 24px; background: #fff; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 8;
}
.main { padding: 28px; }
.page-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 22px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: 1.8rem; }

label { display: block; font-weight: 600; margin-bottom: 6px; color: var(--heading); }
.field { margin-bottom: 14px; }
input, select, textarea {
  width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 12px; outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.2);
}
textarea { min-height: 110px; resize: vertical; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.auth-wrap { max-width: 440px; padding: 56px 0; }
.auth-wrap .card { padding: 1.5rem; }

.table-wrap { overflow: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

.badge {
  display: inline-flex; align-items: center; border-radius: 999px; padding: 3px 10px;
  font-size: 0.75rem; font-weight: 700; background: var(--accent-light); color: var(--primary);
}
.badge.warn { background: #fff7ed; color: var(--warn); }
.badge.danger { background: #fef2f2; color: var(--danger); }
.badge.ok { background: #ecfdf5; color: var(--ok); }
.badge.info { background: #eff6ff; color: var(--info); }

.list { display: grid; gap: 12px; }
.item {
  padding: 16px 18px;
  display: flex; justify-content: space-between; gap: 12px; align-items: center;
}
.timeline { border-left: 2px solid var(--line); margin-left: 10px; padding-left: 18px; display: grid; gap: 16px; }
.toast {
  position: fixed; right: 16px; bottom: 16px; background: var(--heading); color: #fff;
  padding: 12px 16px; border-radius: 12px; max-width: min(360px, calc(100% - 24px)); z-index: 40;
}
.alert {
  padding: 12px 14px; border-radius: 12px; margin-bottom: 14px;
  background: var(--accent-light); color: #0f766e;
}
.alert.warn { background: #fff7ed; color: #9a3412; }
.alert.danger { background: #fef2f2; color: var(--danger); }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.slots { display: flex; flex-wrap: wrap; gap: 8px; }
.slot {
  border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 12px; cursor: pointer;
}
.slot[aria-pressed="true"] { background: var(--primary); color: #fff; border-color: var(--primary); }
.icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.menu-btn { display: none; }
.sidebar .signout { margin-top: auto; color: var(--heading); justify-content: flex-start; }
.row-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.who { color: var(--muted); padding: 0 12px; }
.countdown { font-size: 1.45rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 8px 0; color: var(--heading); }
.card-stack { margin-top: 18px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }

@media (max-width: 1024px) {
  .hero, .grid-3 { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 768px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar {
    display: none; position: fixed; inset: 0 auto 0 0; width: min(280px, 86vw);
    height: 100vh; z-index: 25; box-shadow: var(--shadow);
  }
  .sidebar.open { display: flex; }
  .menu-btn { display: inline-flex; }
  .hero, .grid-3, .grid-2, .form-row { grid-template-columns: 1fr; }
  .main, .topnav, .app-top { padding: 16px; }
  .item { flex-direction: column; align-items: flex-start; }
  .site-nav-toggle { display: inline-flex; }
  .nav-links { display: none; }
  .nav-links.open { display: flex; flex-direction: column; align-items: flex-start; position: absolute; top: 60px; right: 12px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; box-shadow: var(--shadow); z-index: 30; }
}
@media (max-width: 480px) {
  .hero h1, .page-head h1 { font-size: 1.6rem; }
}

  </style>
</head>
<body data-page="doctor-prescriptions">
  <a class="skip" href="#content">Skip to content</a>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="workspace">
      <header class="app-top">
        <button class="menu-btn btn-outline" id="menuBtn" type="button">Menu</button>
        <a class="tiny" href="../index.html">Back to home</a>
      </header>
      <main class="main">
        <div class="page-head"><h1>Issued prescriptions</h1></div>
        <div id="content"></div>
      </main>
    </div>
  </div>

<script data-medicare>
(function () {
'use strict';

async function api(path, options = {}) {
  const init = {
    credentials: 'include',
    headers: { Accept: 'application/json', ...(options.headers || {}) },
    method: options.method || 'GET'
  };
  if (options.body !== undefined) {
    init.headers['Content-Type'] = 'application/json';
    init.body = JSON.stringify(options.body);
  }
  const res = await fetch(path, init);
  const payload = await res.json().catch(() => ({}));
  if (!res.ok) {
    const error = new Error(payload.error?.message || 'Unable to complete this request. Please try again.');
    error.status = res.status;
    error.payload = payload;
    throw error;
  }
  return payload.data;
}

function h(value) {
  return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[ch]));
}

function toast(message) {
  document.querySelectorAll('.toast').forEach((node) => node.remove());
  const el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'status');
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

function icon(name) {
  const paths = {
    home: '<path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/>',
    calendar: '<rect x="4" y="6" width="16" height="14" rx="2"/><path d="M8 4v4M16 4v4M4 11h16"/>',
    pill: '<path d="M8.5 15.5 15.5 8.5A4.95 4.95 0 1 0 8.5 15.5z"/><path d="M9.5 9.5l5 5"/>',
    file: '<path d="M7 4h7l4 4v12H7z"/><path d="M14 4v4h4"/>',
    bell: '<path d="M6 16h12l-1.2-2.2A6 6 0 0 1 16 9a4 4 0 0 0-8 0 6 6 0 0 1-1.8 4.8z"/><path d="M10 18a2 2 0 0 0 4 0"/>',
    user: '<circle cx="12" cy="8" r="3"/><path d="M5 19a7 7 0 0 1 14 0"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2M6.2 6.2l1.4 1.4M16.4 16.4l1.4 1.4M17.8 6.2l-1.4 1.4M7.6 16.4l-1.4 1.4"/>',
    stethoscope: '<path d="M6 4v6a4 4 0 0 0 8 0V4"/><circle cx="18" cy="16" r="3"/><path d="M10 14v1a5 5 0 0 0 5 5h0a3 3 0 0 0 3-3"/>',
    shield: '<path d="M12 3 5 6v6c0 5 3.4 7.7 7 9 3.6-1.3 7-4 7-9V6z"/>',
    logout: '<path d="M10 7V5a1 1 0 0 1 1-1h8v16h-8a1 1 0 0 1-1-1v-2M4 12h10M7 9l-3 3 3 3"/>',
    plus: '<path d="M12 6v12M6 12h12"/>',
    search: '<circle cx="11" cy="11" r="6"/><path d="m20 20-3.5-3.5"/>'
  };
  return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${paths[name] || paths.home}</svg>`;
}

function formatWhen(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '';
  return date.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}

function badge(status) {
  const map = {
    confirmed: 'ok',
    scheduled: 'info',
    in_progress: 'warn',
    completed: 'ok',
    cancelled: 'danger',
    due: 'warn',
    taken: 'ok',
    missed: 'danger',
    skipped: 'danger',
    upcoming: 'info',
    active: 'ok',
    pending: 'warn',
    verified: 'ok'
  };
  return `<span class="badge ${map[status] || ''}">${String(status || '').replaceAll('_', ' ')}</span>`;
}

function page(rootPath) {
  const extra = String(rootPath || '');
  const qIndex = extra.indexOf('?');
  const pathPart = (qIndex === -1 ? extra : extra.slice(0, qIndex)).replace(/^\//, '');
  const query = qIndex === -1 ? '' : extra.slice(qIndex);
  const pathName = (typeof location !== 'undefined' ? location.pathname : '/').replace(/\\/g, '/');
  const parts = pathName.split('/').filter(Boolean);
  const last = parts[parts.length - 1] || '';
  const folders = last.includes('.') ? Math.max(0, parts.length - 1) : parts.length;
  const prefix = folders ? '../'.repeat(folders) : '';
  return prefix + pathPart + query;
}

function loginFor(role) {
  if (role === 'doctor') return page('doctor/login.html');
  if (role === 'admin') return page('admin/login.html');
  return page('patient/login.html');
}

function homeFor(role) {
  if (role === 'doctor') return page('doctor/dashboard.html');
  if (role === 'admin') return page('admin/dashboard.html');
  return page('patient/dashboard.html');
}

function navActive(rootPath) {
  const file = String(rootPath).split('?')[0].split('/').pop();
  const pathName = location.pathname.replace(/\\/g, '/');
  if (rootPath.startsWith('doctors')) {
    return pathName.includes('/doctors');
  }
  return pathName.endsWith('/' + file) || pathName.endsWith(file);
}

const PATIENT_NAV = [
  ['patient/dashboard.html', 'home', 'Home'],
  ['doctors/index.html', 'search', 'Find doctors'],
  ['patient/appointments.html', 'calendar', 'Appointments'],
  ['patient/book-appointment.html', 'plus', 'Book'],
  ['patient/prescriptions.html', 'file', 'Prescriptions'],
  ['patient/medications.html', 'pill', 'Medications'],
  ['patient/medical-history.html', 'file', 'History'],
  ['patient/notifications.html', 'bell', 'Notifications'],
  ['patient/profile.html', 'user', 'Profile'],
  ['patient/settings.html', 'settings', 'Settings']
];

const DOCTOR_NAV = [
  ['doctor/dashboard.html', 'home', 'Home'],
  ['doctor/appointments.html', 'calendar', 'Appointments'],
  ['doctor/consultation.html', 'stethoscope', 'Consultation'],
  ['doctor/prescriptions.html', 'file', 'Prescriptions'],
  ['doctor/profile.html', 'user', 'Profile']
];

async function requireRole(role) {
  try {
    const data = await api('/api/auth/me');
    if (!data.user) {
      window.location.href = loginFor(role);
      throw new Error('redirect');
    }
    if (data.user.role !== role) {
      window.location.href = homeFor(data.user.role);
      throw new Error('redirect');
    }
    return data;
  } catch (err) {
    if (err.message === 'redirect') throw err;
    window.location.href = loginFor(role);
    throw new Error('redirect');
  }
}

function renderShell(role, active, user) {
  const nav = role === 'doctor' ? DOCTOR_NAV : PATIENT_NAV;
  const aside = document.getElementById('sidebar');
  const home = homeFor(role);
  const who = user ? `<p class="tiny who">${h(user.name)}</p>` : '';
  aside.innerHTML = `
    <a class="brand" href="${home}">
      <span class="logo">${icon('shield')}</span><span class="brand-mark">MediCare+</span>
    </a>
    ${who}
    ${nav.map(([href, ic, label]) => `<a href="${page(href)}" class="${navActive(href) ? 'active' : ''}">${icon(ic)}${label}</a>`).join('')}
    <button class="btn-ghost signout" id="logoutBtn" type="button">${icon('logout')} Sign out</button>
  `;
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    try { await api('/api/auth/logout', { method: 'POST', body: {} }); } catch (_) { /* ignore */ }
    window.location.href = loginFor(role);
  });
  const menu = document.getElementById('menuBtn');
  if (menu) menu.addEventListener('click', () => aside.classList.toggle('open'));
}

function doseAt(row) {
  const time = String(row.scheduled_time || '00:00:00').slice(0, 8);
  return new Date(`${row.scheduled_date}T${time.length === 5 ? `${time}:00` : time}`);
}

function formatCountdown(ms) {
  if (ms <= 0) return 'Due now';
  const total = Math.floor(ms / 1000);
  const hours = Math.floor(total / 3600);
  const minutes = Math.floor((total % 3600) / 60);
  const seconds = total % 60;
  return `${hours}h ${String(minutes).padStart(2, '0')}m ${String(seconds).padStart(2, '0')}s`;
}

window.Medicare = {
  api,
  toast,
  icon,
  formatWhen,
  badge,
  requireRole,
  renderShell,
  h,
  doseAt,
  formatCountdown,
  page,
  loginFor,
  homeFor
};

})();
(function () {
'use strict';

(function () {
const { api, toast, formatWhen, badge, requireRole, renderShell, page: hrefTo } = window.Medicare;
const view = document.body.dataset.page;
const params = new URLSearchParams(location.search);

function qs(id) { return document.getElementById(id); }

async function boot() {
  const data = await requireRole('doctor');
  renderShell('doctor', location.pathname, data.user);
  if (view === 'doctor-dashboard') return dashboard();
  if (view === 'doctor-appointments') return appointments();
  if (view === 'doctor-consultation') return consultation();
  if (view === 'doctor-prescriptions') return prescriptions();
  if (view === 'doctor-profile') return profile(data);
}

async function dashboard() {
  const data = await api('/api/doctor/overview');
  qs('content').innerHTML = `
    <div class="alert ${data.profile.verification_status === 'verified' ? '' : 'warn'}">
      Verification status: ${data.profile.verification_status}. Only verified clinicians appear in booking.
    </div>
    <div class="list">
      ${data.appointments.map((row) => `<a class="item" href="${hrefTo('doctor/consultation.html?id=' + row.id)}">
        <div><strong>${row.patient_name}</strong><div class="tiny">${formatWhen(row.appointment_start)} · ${row.reason || 'Consultation'}</div></div>
        ${badge(row.status)}
      </a>`).join('') || '<div class="empty">No appointments yet.</div>'}
    </div>`;
}

async function appointments() {
  const data = await api('/api/appointments');
  qs('content').innerHTML = data.items.map((row) => `
    <div class="item">
      <div><strong>${row.patient_name}</strong><div class="tiny">${formatWhen(row.appointment_start)}</div></div>
      <div style="display:flex;gap:8px;align-items:center">
        ${badge(row.status)}
        <a class="btn" href="${hrefTo('doctor/consultation.html?id=' + row.id)}">Open</a>
      </div>
    </div>`).join('') || '<div class="empty">No appointments.</div>';
}

async function consultation() {
  const id = params.get('id');
  if (!id) {
    qs('content').innerHTML = '<div class="empty">Select an appointment from your schedule.</div>';
    return;
  }
  let access;
  try {
    access = await api(`/api/appointments/${id}/access`);
  } catch (err) {
    qs('content').innerHTML = `<div class="alert danger">${err.message}</div>`;
    return;
  }
  const stateClass = access.state === 'during' ? '' : access.state === 'before' ? 'warn' : 'danger';
  let extra = '';
  if (access.allowed) {
    const summary = await api(`/api/appointments/${id}/patient-summary`);
    extra = `
      <section class="card">
        <h3>Authorized patient information</h3>
        <p><strong>${summary.patient.name}</strong></p>
        <p class="tiny">DoB: ${summary.patient.date_of_birth || '—'} · Phone: ${summary.patient.phone || '—'}</p>
        <p class="tiny">Emergency: ${summary.patient.emergency_contact_name || '—'} ${summary.patient.emergency_contact_phone || ''}</p>
        <h4>Relevant history</h4>
        ${summary.history.map((h) => `<p class="tiny">${formatWhen(h.created_at)} — ${h.summary}</p>`).join('') || '<p class="muted">No prior history.</p>'}
      </section>
      <form id="consultForm" class="card">
        <h3>Consultation record</h3>
        <div class="field"><label>Chief complaint</label><input name="chief_complaint"></div>
        <div class="field"><label>Symptoms</label><textarea name="symptoms"></textarea></div>
        <div class="field"><label>Diagnosis</label><input name="diagnosis"></div>
        <div class="field"><label>Notes</label><textarea name="doctor_notes"></textarea></div>
        <div class="field"><label>Treatment plan</label><textarea name="treatment_plan"></textarea></div>
        <div class="field"><label>Follow-up</label><textarea name="follow_up_instructions"></textarea></div>
        <button class="btn-secondary" type="submit">Save consultation</button>
      </form>
      <form id="rxForm" class="card">
        <h3>Digital prescription</h3>
        <p class="tiny">Issuing a prescription notifies the patient and generates the medication schedule automatically.</p>
        <div class="form-row">
          <div class="field"><label>Medicine</label><input name="medicine_name" required></div>
          <div class="field"><label>Dosage</label><input name="dosage" required placeholder="500 mg"></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Frequency</label><input name="frequency" required placeholder="3 times daily"></div>
          <div class="field"><label>Duration</label><input name="duration" required placeholder="5 days"></div>
        </div>
        <div class="field"><label>Instructions</label><input name="instructions" placeholder="After food"></div>
        <div class="field"><label>Prescription notes</label><textarea name="notes"></textarea></div>
        <button class="btn" type="submit">Issue prescription</button>
      </form>`;
  }
  qs('content').innerHTML = `
    <div class="alert ${stateClass}">${access.message}</div>
    <div class="card">
      <p class="kicker">${access.appointment.type} consultation</p>
      <h2>${access.appointment.patient_name}</h2>
      <p class="muted">${formatWhen(access.appointment.appointment_start)} – ${formatWhen(access.appointment.appointment_end)}</p>
      ${access.allowed ? `<button class="btn" id="startBtn">Start consultation</button>` : ''}
    </div>
    ${extra}`;
  qs('startBtn')?.addEventListener('click', async () => {
    try {
      await api(`/api/appointments/${id}/start`, { method: 'POST', body: {} });
      toast('Consultation started.');
    } catch (err) { toast(err.message); }
  });
  qs('consultForm')?.addEventListener('submit', async (event) => {
    event.preventDefault();
    try {
      await api(`/api/appointments/${id}/consultation`, { method: 'POST', body: Object.fromEntries(new FormData(event.target).entries()) });
      toast('Consultation saved.');
    } catch (err) { toast(err.message); }
  });
  qs('rxForm')?.addEventListener('submit', async (event) => {
    event.preventDefault();
    const form = Object.fromEntries(new FormData(event.target).entries());
    try {
      const consult = await api(`/api/appointments/${id}/consultation`, { method: 'POST', body: { diagnosis: form.notes || 'See prescription' } });
      await api('/api/prescriptions', {
        method: 'POST',
        body: {
          consultation_id: consult.consultation.id,
          notes: form.notes,
          medicines: [{
            medicine_name: form.medicine_name,
            dosage: form.dosage,
            frequency: form.frequency,
            duration: form.duration,
            instructions: form.instructions
          }]
        }
      });
      toast('Prescription issued and delivered to the patient.');
      location.href = hrefTo('doctor/prescriptions.html');
    } catch (err) { toast(err.message); }
  });
}

async function prescriptions() {
  const data = await api('/api/prescriptions');
  qs('content').innerHTML = data.items.map((rx) => `
    <article class="card">
      <div class="page-head"><h3 style="margin:0">${rx.patient_name}</h3>${badge(rx.status)}</div>
      <ul>${(rx.medicines || []).map((m) => `<li>${m.medicine_name} — ${m.dosage}, ${m.frequency}</li>`).join('')}</ul>
    </article>`).join('') || '<div class="empty">No prescriptions issued yet.</div>';
}

async function profile(session) {
  const data = await api('/api/doctor/profile');
  const p = data.profile;
  qs('content').innerHTML = `
    <form id="docForm" class="card">
      <p>${badge(p.verification_status)}</p>
      <div class="form-row">
        <div class="field"><label>Name</label><input name="name" value="${session.user.name}"></div>
        <div class="field"><label>Specialization</label><input name="specialization" value="${p.specialization || ''}"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Qualification</label><input name="qualification" value="${p.qualification || ''}"></div>
        <div class="field"><label>Experience (years)</label><input name="experience_years" type="number" value="${p.experience_years || 0}"></div>
      </div>
      <div class="field"><label>Bio</label><textarea name="bio">${p.bio || ''}</textarea></div>
      <p class="tiny">License number is verified separately and cannot be edited here.</p>
      <button class="btn">Save profile</button>
    </form>`;
  qs('docForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    try {
      await api('/api/doctor/profile', { method: 'PATCH', body: Object.fromEntries(new FormData(event.target).entries()) });
      toast('Profile saved.');
    } catch (err) { toast(err.message); }
  });
}

boot().catch((err) => {
  if (err.message !== 'redirect') toast(err.message || 'Unable to load this page.');
});
})();

})();
</script>
</body>
</html>
