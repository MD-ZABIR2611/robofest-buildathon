<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare+ | Find a Doctor</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>➕</text></svg>" />
    <style>
        :root{--primary:#0d9488;--primary-hover:#0f766e;--primary-light:#ccfbf1;--bg-main:#f8fafc;--bg-dark:#0f172a;--surface:#ffffff;--text-primary:#0f172a;--text-secondary:#64748b;--border:#e2e8f0;--radius-sm:10px;--radius-md:16px;--radius-lg:24px;--shadow-sm:0 2px 8px rgba(15,23,42,.04);--shadow-md:0 8px 30px rgba(15,23,42,.08);--transition:all .3s ease}
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,sans-serif}body{background:var(--bg-main);color:var(--text-primary);line-height:1.6}a{text-decoration:none;color:inherit}button{cursor:pointer;border:none;background:none}
        .container{max-width:1200px;margin:0 auto;padding:0 1.5rem}
        header{background:rgba(255,255,255,.8);backdrop-filter:blur(12px);box-shadow:var(--shadow-sm);position:sticky;top:0;z-index:1000;border-bottom:1px solid var(--border)}.navbar{display:flex;justify-content:space-between;align-items:center;height:72px}.logo{font-weight:800;font-size:1.5rem;color:var(--primary-hover);display:flex;align-items:center;gap:.5rem}.logo span{color:var(--primary)}
        .nav-links{display:flex;align-items:center;gap:.5rem}.nav-links a{font-weight:500;color:var(--text-secondary);transition:var(--transition);padding:.5rem .9rem;border-radius:var(--radius-sm);font-size:.95rem}.nav-links a:hover,.nav-links a.active{color:var(--primary-hover);background:var(--primary-light)}.nav-cta-group{display:flex;align-items:center;gap:1rem}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 1.6rem;border-radius:var(--radius-sm);font-weight:600;transition:var(--transition);font-size:.95rem;cursor:pointer;border:none}.btn-primary{background:var(--primary);color:white}.btn-primary:hover{background:var(--primary-hover);transform:translateY(-2px)}.btn-outline{border:2px solid var(--border);color:var(--text-primary);background:transparent}.btn-outline:hover{border-color:var(--primary);color:var(--primary-hover);background:var(--primary-light)}
        .mobile-menu-btn{display:none;background:none;border:none;cursor:pointer;padding:.5rem}.mobile-overlay{position:fixed;top:0;left:0;width:100%;height:100vh;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);z-index:999;opacity:0;visibility:hidden;transition:var(--transition)}.mobile-overlay.active{opacity:1;visibility:visible}.mobile-nav{position:fixed;top:0;right:-100%;width:80%;max-width:320px;height:100vh;background:var(--surface);z-index:1001;padding:2rem 1.5rem;transition:var(--transition);box-shadow:var(--shadow-md);overflow-y:auto}.mobile-nav.active{right:0}.mobile-nav a{display:block;padding:1rem 0;border-bottom:1px solid var(--border);color:var(--text-primary);font-weight:500}.close-mobile{position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--text-secondary)}
        .page-hero{background:var(--surface);padding:3rem 0 2rem;border-bottom:1px solid var(--border);margin-bottom:3rem}.page-hero h1{font-size:2.5rem;font-weight:700;margin-bottom:.5rem}.page-hero p{color:var(--text-secondary);font-size:1.1rem}
        .filter-bar{display:flex;gap:1rem;margin-bottom:2.5rem;background:var(--surface);padding:1rem;border-radius:var(--radius-md);box-shadow:var(--shadow-sm);border:1px solid var(--border)}.search-input{flex:1;display:flex;align-items:center;gap:.5rem;background:var(--bg-main);border-radius:var(--radius-sm);padding:0 1rem}.search-input input{border:none;background:transparent;padding:.85rem 0;width:100%;outline:none;font-size:1rem;color:var(--text-primary)}.filter-select{display:flex;align-items:center;gap:.5rem;background:var(--bg-main);border-radius:var(--radius-sm);padding:0 1rem;min-width:250px}.filter-select select{border:none;background:transparent;padding:.85rem 0;width:100%;outline:none;font-size:1rem;color:var(--text-primary)}
        .doctor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;padding-bottom:4rem}.doctor-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:1.5rem;transition:var(--transition);display:flex;flex-direction:column}.doctor-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-md);border-color:var(--primary-light)}
        .doc-header{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem}.doc-avatar{width:56px;height:56px;border-radius:50%;background:var(--primary-light);color:var(--primary-hover);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.2rem}.doc-info h3{font-size:1.1rem;margin-bottom:.25rem}.doc-info p{font-size:.9rem;color:var(--text-secondary);margin:0}
        .doc-details{margin-bottom:1.5rem;font-size:.9rem;flex-grow:1}.doc-details div{display:flex;justify-content:space-between;margin-bottom:.75rem;color:var(--text-secondary)}.doc-details strong{color:var(--text-primary)}
        .doc-actions{display:flex;gap:.75rem}.doc-actions .btn{width:100%;padding:.65rem 1rem;font-size:.9rem}
        @media (max-width:1024px){.doctor-grid{grid-template-columns:repeat(2,1fr)}}@media (max-width:768px){.nav-links{display:none}.mobile-menu-btn{display:block}.doctor-grid{grid-template-columns:1fr}.filter-bar{flex-direction:column}.filter-select{min-width:100%}}
    </style>
</head>
<body>
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg> MediCare<span>+</span></a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="doctor.html" class="active">Doctors</a>
                <a href="appointments.html">Appointments</a>
                <a href="presciption.html">Prescriptions</a>
                <a href="medreminder.html">Medications</a>
                <a href="medhistory.html">History</a>
            </nav>
            <div class="nav-cta-group">
                <a href="dashboard.html" class="btn btn-outline">Dashboard</a>
                <button class="mobile-menu-btn" onclick="toggleMobileMenu(true)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
            </div>
        </div>
    </header>
    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleMobileMenu(false)"></div>
    <nav class="mobile-nav" id="mobileNav">
        <button class="close-mobile" onclick="toggleMobileMenu(false)">&times;</button>
        <a href="index.html">Home</a>
        <a href="doctor.html">Doctors</a>
        <a href="appointments.html">Appointments</a>
        <a href="presciption.html">Prescriptions</a>
        <a href="medreminder.html">Medications</a>
        <a href="medhistory.html">History</a>
    </nav>
    <section class="page-hero">
        <div class="container"><h1>Find a Doctor</h1><p>Search for healthcare professionals by name or specialization.</p></div>
    </section>
    <main>
        <div class="container">
            <div class="filter-bar">
                <div class="search-input"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-secondary)"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" placeholder="Search doctors by name..." id="search-input" oninput="filterDoctors()"></div>
                <div class="filter-select"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-secondary)"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg><select id="spec-filter" onchange="filterDoctors()"><option value="">All Specializations</option><option value="General Medicine">General Medicine</option><option value="Cardiology">Cardiology</option><option value="Dermatology">Dermatology</option><option value="Neurology">Neurology</option><option value="Pediatrics">Pediatrics</option></select></div>
            </div>
            <div class="doctor-grid" id="doctor-grid"></div>
        </div>
    </main>
    <script>
        function toggleMobileMenu(open){document.getElementById('mobileNav').classList.toggle('active',open);document.getElementById('mobileOverlay').classList.toggle('active',open)}
        const doctors=[{id:1,name:"Dr. Sarah Ahmed",spec:"General Medicine",exp:8,avail:"Today / Tomorrow",type:"Video / In-Person"},{id:2,name:"Dr. John Smith",spec:"Cardiology",exp:12,avail:"Tomorrow",type:"Video"},{id:3,name:"Dr. Lisa Chen",spec:"Dermatology",exp:6,avail:"Today",type:"In-Person"},{id:4,name:"Dr. Robert King",spec:"Neurology",exp:15,avail:"Friday",type:"Video"},{id:5,name:"Dr. Emily Davis",spec:"Pediatrics",exp:10,avail:"Today / Tomorrow",type:"Video / In-Person"},{id:6,name:"Dr. Michael Wong",spec:"General Medicine",exp:7,avail:"Next Week",type:"Video"}];
        function renderDoctors(list){const grid=document.getElementById('doctor-grid');grid.innerHTML='';if(list.length===0){grid.innerHTML='<p style="text-align:center;color:var(--text-secondary);grid-column:1 / -1;padding:2rem;">No doctors found matching your criteria.</p>';return}list.forEach(doc=>{const initials=doc.name.replace('Dr. ','').split(' ').map(n=>n[0]).join('');const card=document.createElement('div');card.className='doctor-card';card.innerHTML=`<div class="doc-header"><div class="doc-avatar">${initials}</div><div class="doc-info"><h3>${doc.name}</h3><p>${doc.spec}</p></div></div><div class="doc-details"><div><span>Experience:</span> <strong>${doc.exp} years</strong></div><div><span>Availability:</span> <strong>${doc.avail}</strong></div><div><span>Consultation:</span> <strong>${doc.type}</strong></div></div><div class="doc-actions"><button class="btn btn-outline" onclick="alert('Profile for ${doc.name}')">View Profile</button><button class="btn btn-primary" onclick="window.location.href='book-appointment.html'">Book</button></div>`;grid.appendChild(card)})}
        function filterDoctors(){const searchTerm=document.getElementById('search-input').value.toLowerCase();const spec=document.getElementById('spec-filter').value;const filtered=doctors.filter(doc=>{const matchesSearch=doc.name.toLowerCase().includes(searchTerm);const matchesSpec=spec===""||doc.spec===spec;return matchesSearch&&matchesSpec});renderDoctors(filtered)}
        document.addEventListener('DOMContentLoaded',()=>renderDoctors(doctors));
    </script>

        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBYWfoKu_618OEGJP0jRPMbM64aYXvUALk",
            authDomain: "medicareplus-31498.firebaseapp.com",
            projectId: "medicareplus-31498",
            storageBucket: "medicareplus-31498.firebasestorage.app",
            messagingSenderId: "28194392967",
            appId: "1:28194392967:web:09bd28993ece7052e06122",
            measurementId: "G-KW4H8T7MEN"
        };
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        onAuthStateChanged(auth, (user) => { if (!user) window.location.href = 'index.html'; });
    </script>
</body>
</html>
