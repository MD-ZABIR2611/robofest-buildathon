<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare+ | Patient Login</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>➕</text></svg>" />
    <style>
        :root {
            --primary: #0d9488; --primary-hover: #0f766e; --primary-light: #ccfbf1;
            --bg-main: #f8fafc; --bg-dark: #0f172a; --surface: #ffffff;
            --text-primary: #0f172a; --text-secondary: #64748b; --border: #e2e8f0;
            --radius-sm: 10px; --radius-md: 16px; --radius-lg: 24px;
            --shadow-md: 0 8px 30px rgba(15, 23, 42, 0.08); --shadow-lg: 0 20px 50px rgba(15, 23, 42, 0.12);
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: var(--bg-main); color: var(--text-primary); line-height: 1.6; -webkit-font-smoothing: antialiased; }
        a { text-decoration: none; color: inherit; }
        
        .auth-container { display: flex; min-height: 100vh; }
        
        /* Left Branding Panel */
        .auth-left { 
            flex: 1; background: linear-gradient(135deg, #0f766e 0%, #0d9488 100%); 
            color: white; display: flex; flex-direction: column; justify-content: center; 
            padding: 4rem; position: relative; overflow: hidden;
        }
        .auth-left::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%); pointer-events: none; }
        .auth-logo { font-weight: 800; font-size: 2rem; margin-bottom: 2rem; display: flex; align-items: center; gap: 0.5rem; position: relative; z-index: 1; }
        .auth-logo span { color: var(--primary-light); }
        .auth-welcome { position: relative; z-index: 1; }
        .auth-welcome h1 { font-size: 3rem; font-weight: 800; margin-bottom: 1rem; letter-spacing: -0.03em; }
        .auth-welcome p { font-size: 1.2rem; color: rgba(255,255,255,0.8); margin-bottom: 2rem; max-width: 400px; }
        .auth-features { position: relative; z-index: 1; }
        .auth-feature { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; color: rgba(255,255,255,0.9); }
        .auth-feature svg { background: rgba(255,255,255,0.1); padding: 0.5rem; border-radius: 10px; }
        
        /* Right Form Panel */
        .auth-right { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; background: var(--bg-main); }
        .auth-form-container { width: 100%; max-width: 420px; }
        .auth-tabs { display: flex; background: var(--surface); border-radius: var(--radius-md); padding: 0.25rem; margin-bottom: 2rem; box-shadow: var(--shadow-md); }
        .auth-tab { flex: 1; padding: 0.75rem; border: none; background: transparent; cursor: pointer; border-radius: 12px; font-weight: 600; color: var(--text-secondary); transition: var(--transition); font-size: 1rem; }
        .auth-tab.active { background: var(--primary); color: white; }
        
        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: var(--text-primary); }
        .form-input { width: 100%; padding: 0.9rem 1rem; border: 2px solid var(--border); border-radius: 12px; font-size: 1rem; transition: var(--transition); background: var(--surface); }
        .form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-light); }
        
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.9rem 1.6rem; border-radius: 12px; font-weight: 600; cursor: pointer; border: none; transition: var(--transition); font-size: 1rem; width: 100%; }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 8px 20px rgba(13, 148, 136, 0.25); }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }
        
        .auth-footer { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary); }
        .auth-footer a { color: var(--primary-hover); font-weight: 600; }
        
        /* Hidden state for forms */
        .hidden { display: none; }
        
        /* Responsive */
        @media (max-width: 900px) {
            .auth-container { flex-direction: column; }
            .auth-left { padding: 3rem 2rem; min-height: auto; }
            .auth-welcome h1 { font-size: 2.5rem; }
            .auth-right { padding: 3rem 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Left Side -->
        <div class="auth-left">
            <div class="auth-logo">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>
                MediCare<span>+</span>
            </div>
            <div class="auth-welcome">
                <h1>Welcome back.</h1>
                <p>Manage your health, appointments, and prescriptions all in one secure place.</p>
            </div>
            <div class="auth-features">
                <div class="auth-feature">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg>
                    Easy Appointment Booking
                </div>
                <div class="auth-feature">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.5 20.5 3.5 13.5a5 5 0 0 1 7-7l7 7a5 5 0 0 1-7 7Z"/></svg>
                    Automatic Medication Reminders
                </div>
                <div class="auth-feature">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    Secure & Private Medical History
                </div>
            </div>
        </div>

        <!-- Right Side -->
        <div class="auth-right">
            <div class="auth-form-container">
                <div class="auth-tabs">
                    <button class="auth-tab active" onclick="switchTab('login')">Login</button>
                    <button class="auth-tab" onclick="switchTab('register')">Register</button>
                </div>

                <!-- Login Form -->
                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-input" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-input" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Login to Dashboard</button>
                    <p class="auth-footer">Forgot password? <a href="#">Reset here</a></p>
                </form>

                <!-- Register Form -->
                <form id="registerForm" class="auth-form hidden">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-input" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-input" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-input" placeholder="Create a secure password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Create Patient Account</button>
                    <p class="auth-footer">Are you a doctor? <a href="doctor-login.html">Login here</a></p>
                </form>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabs = document.querySelectorAll('.auth-tab');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabs[0].classList.remove('active');
                tabs[1].classList.add('active');
            }
        }
    </script>
</body>
</html>
