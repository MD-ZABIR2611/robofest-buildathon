services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medicare
      POSTGRES_PASSWORD: medicare
      POSTGRES_DB: medicare
    ports:
      - "5432:5432"
    volumes:
      - medicare_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medicare_pg:
