<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare+ | My Appointments</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>➕</text></svg>" />
    <style>
        :root{--primary:#0d9488;--primary-hover:#0f766e;--primary-light:#ccfbf1;--bg-main:#f8fafc;--bg-dark:#0f172a;--surface:#ffffff;--text-primary:#0f172a;--text-secondary:#64748b;--border:#e2e8f0;--success:#16a34a;--success-light:#f0fdf4;--danger:#dc2626;--danger-light:#fef2f2;--radius-sm:10px;--radius-md:16px;--radius-lg:24px;--shadow-sm:0 2px 8px rgba(15,23,42,.04);--shadow-md:0 8px 30px rgba(15,23,42,.08);--transition:all .3s ease}
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,sans-serif}body{background:var(--bg-main);color:var(--text-primary);line-height:1.6}a{text-decoration:none;color:inherit}button{cursor:pointer;border:none;background:none}
        .container{max-width:1100px;margin:0 auto;padding:0 1.5rem}
        header{background:rgba(255,255,255,.8);backdrop-filter:blur(12px);box-shadow:var(--shadow-sm);position:sticky;top:0;z-index:1000;border-bottom:1px solid var(--border)}.navbar{display:flex;justify-content:space-between;align-items:center;height:72px}.logo{font-weight:800;font-size:1.5rem;color:var(--primary-hover);display:flex;align-items:center;gap:.5rem}.logo span{color:var(--primary)}
        .nav-links{display:flex;align-items:center;gap:.5rem}.nav-links a{font-weight:500;color:var(--text-secondary);transition:var(--transition);padding:.5rem .9rem;border-radius:var(--radius-sm);font-size:.95rem}.nav-links a:hover,.nav-links a.active{color:var(--primary-hover);background:var(--primary-light)}.nav-cta-group{display:flex;align-items:center;gap:1rem}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 1.6rem;border-radius:var(--radius-sm);font-weight:600;transition:var(--transition);font-size:.95rem;cursor:pointer;border:none}.btn-primary{background:var(--primary);color:white}.btn-primary:hover{background:var(--primary-hover);transform:translateY(-2px)}.btn-outline{border:2px solid var(--border);color:var(--text-primary);background:transparent}.btn-outline:hover{border-color:var(--primary);color:var(--primary-hover);background:var(--primary-light)}.btn-danger{color:var(--danger);border:2px solid var(--danger-light);background:var(--danger-light)}.btn-danger:hover{background:var(--danger);color:white;border-color:var(--danger)}
        .mobile-menu-btn{display:none;background:none;border:none;cursor:pointer;padding:.5rem}.mobile-overlay{position:fixed;top:0;left:0;width:100%;height:100vh;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);z-index:999;opacity:0;visibility:hidden;transition:var(--transition)}.mobile-overlay.active{opacity:1;visibility:visible}.mobile-nav{position:fixed;top:0;right:-100%;width:80%;max-width:320px;height:100vh;background:var(--surface);z-index:1001;padding:2rem 1.5rem;transition:var(--transition);box-shadow:var(--shadow-md);overflow-y:auto}.mobile-nav.active{right:0}.mobile-nav a{display:block;padding:1rem 0;border-bottom:1px solid var(--border);color:var(--text-primary);font-weight:500}.close-mobile{position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--text-secondary)}
        .page-hero{background:var(--surface);padding:3rem 0 2rem;border-bottom:1px solid var(--border);margin-bottom:3rem}.page-hero h1{font-size:2.5rem;font-weight:700;margin-bottom:.5rem}.page-hero p{color:var(--text-secondary);font-size:1.1rem}
        .appt-list{display:flex;flex-direction:column;gap:1.5rem;padding-bottom:4rem}.appt-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:1.5rem;transition:var(--transition)}.appt-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
        .appt-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.5rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}.appt-doctor{display:flex;align-items:center;gap:1rem}.doc-avatar{width:48px;height:48px;border-radius:50%;background:var(--primary-light);color:var(--primary-hover);display:flex;align-items:center;justify-content:center;font-weight:700}.appt-doctor h3{font-size:1.1rem;margin:0}.appt-doctor p{font-size:.9rem;color:var(--text-secondary);margin:0}
        .status-badge{padding:.35rem .9rem;border-radius:9999px;font-size:.8rem;font-weight:600;text-transform:uppercase;background:var(--success-light);color:var(--success)}
        .appt-details{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem}.detail-item{display:flex;align-items:flex-start;gap:.75rem}.detail-content .label{font-size:.8rem;color:var(--text-secondary);text-transform:uppercase;font-weight:600}.detail-content .value{font-size:.95rem;font-weight:600}
        .appt-footer{display:flex;gap:1rem;justify-content:flex-end;padding-top:1.5rem;border-top:1px solid var(--border)}
        .empty-state{text-align:center;padding:4rem 2rem;background:var(--surface);border-radius:var(--radius-lg);border:1px dashed var(--border)}.empty-state h3{font-size:1.25rem;margin-bottom:.5rem}.empty-state p{color:var(--text-secondary);margin-bottom:2rem}
        @media (max-width:900px){.nav-links{display:none}.mobile-menu-btn{display:block}.appt-header{flex-direction:column;gap:1rem}}@media (max-width:480px){.appt-details{grid-template-columns:1fr}.appt-footer{flex-direction:column}}
    </style>
</head>
<body>
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg> MediCare<span>+</span></a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="doctor.html">Doctors</a>
                <a href="appointments.html" class="active">Appointments</a>
                <a href="presciption.html">Prescriptions</a>
                <a href="medreminder.html">Medications</a>
                <a href="medhistory.html">History</a>
            </nav>
            <div class="nav-cta-group">
                <a href="book-appointment.html" class="btn btn-primary">Book Appointment</a>
                <button class="mobile-menu-btn" onclick="toggleMobileMenu(true)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
            </div>
        </div>
    </header>
    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleMobileMenu(false)"></div>
    <nav class="mobile-nav" id="mobileNav">
        <button class="close-mobile" onclick="toggleMobileMenu(false)">&times;</button>
        <a href="index.html">Home</a>
        <a href="doctor.html">Doctors</a>
        <a href="appointments.html">Appointments</a>
       <a href="presciption.html">Prescriptions</a>
        <a href="medreminder.html">Medications</a>
        <a href="book-appointment.html">Book Appointment</a>
        <a href="medhistory.html">History</a>
    </nav>
    <section class="page-hero">
        <div class="container"><h1>My Appointments</h1><p>View and manage your upcoming and past consultations.</p></div>
    </section>
    <main>
        <div class="container"><div class="appt-list" id="appt-list-container"></div></div>
    </main>
    <script>
        function toggleMobileMenu(open){document.getElementById('mobileNav').classList.toggle('active',open);document.getElementById('mobileOverlay').classList.toggle('active',open)}
        function renderAppointments(){
            const container=document.getElementById('appt-list-container');
            const appointments=JSON.parse(localStorage.getItem('medicare_appointments')||'[]');
            if(appointments.length===0){container.innerHTML=`<div class="empty-state"><h3>No Appointments Yet</h3><p>You haven't booked any appointments. Get started by booking your first consultation.</p><a href="book-appointment.html" class="btn btn-primary">Book an Appointment</a></div>`;return}
            container.innerHTML='';
            appointments.forEach(appt=>{const card=document.createElement('div');card.className='appt-card';card.innerHTML=`<div class="appt-header"><div class="appt-doctor"><div class="doc-avatar">${appt.doctor.replace('Dr. ','').split(' ').map(n=>n[0]).join('')}</div><div><h3>${appt.doctor}</h3><p>${appt.spec} - ${appt.hospital}</p></div></div><span class="status-badge">${appt.status}</span></div><div class="appt-details"><div class="detail-item"><div class="detail-content"><div class="label">Date</div><div class="value">${appt.date}</div></div></div><div class="detail-item"><div class="detail-content"><div class="label">Time</div><div class="value">${appt.time}</div></div></div><div class="detail-item"><div class="detail-content"><div class="label">Patient</div><div class="value">${appt.patientName}</div></div></div><div class="detail-item"><div class="detail-content"><div class="label">Reason</div><div class="value" style="font-weight:400;color:var(--text-secondary);">${appt.reason}</div></div></div></div><div class="appt-footer"><button class="btn btn-danger" onclick="cancelAppointment(${appt.id})">Cancel</button><button class="btn btn-primary">View Details</button></div>`;container.appendChild(card)})
        }
        function cancelAppointment(id){if(!confirm("Are you sure you want to cancel this appointment?"))return;let appointments=JSON.parse(localStorage.getItem('medicare_appointments')||'[]');appointments=appointments.filter(appt=>appt.id!==id);localStorage.setItem('medicare_appointments',JSON.stringify(appointments));renderAppointments()}
        document.addEventListener('DOMContentLoaded',renderAppointments);
    </script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        const firebaseConfig = {
            apiKey: "AIzaSyBYWfoKu_618OEGJP0jRPMbM64aYXvUALk",
            authDomain: "medicareplus-31498.firebaseapp.com",
            projectId: "medicareplus-31498",
            storageBucket: "medicareplus-31498.firebasestorage.app",
            messagingSenderId: "28194392967",
            appId: "1:28194392967:web:09bd28993ece7052e06122",
            measurementId: "G-KW4H8T7MEN"
        };
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        onAuthStateChanged(auth, (user) => { if (!user) window.location.href = 'index.html'; });
    </script>
</body>
</html>
