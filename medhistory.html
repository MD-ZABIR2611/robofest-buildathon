<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare+ | Medical History</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>➕</text></svg>" />
    <style>
        :root {
            --primary: #0d9488; --primary-hover: #0f766e; --primary-light: #ccfbf1;
            --bg-main: #f8fafc; --bg-dark: #0f172a; --surface: #ffffff;
            --text-primary: #0f172a; --text-secondary: #64748b; --border: #e2e8f0;
            --success: #16a34a; --success-light: #f0fdf4;
            --radius-sm: 10px; --radius-md: 16px; --radius-lg: 24px;
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04); --shadow-md: 0 8px 30px rgba(15, 23, 42, 0.08);
            --transition: all 0.3s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
        body { background: var(--bg-main); color: var(--text-primary); line-height: 1.6; }
        a { text-decoration: none; color: inherit; } button { cursor: pointer; border: none; background: none; }

        .container { max-width: 900px; margin: 0 auto; padding: 0 1.5rem; }

        /* Header */
        header { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); box-shadow: var(--shadow-sm); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border); }
        .navbar { display: flex; justify-content: space-between; align-items: center; height: 72px; }
        .logo { font-weight: 800; font-size: 1.5rem; color: var(--primary-hover); display: flex; align-items: center; gap: 0.5rem; }
        .logo span { color: var(--primary); }
        .nav-links { display: flex; align-items: center; gap: 0.5rem; }
        .nav-links a { font-weight: 500; color: var(--text-secondary); transition: var(--transition); padding: 0.5rem 0.9rem; border-radius: var(--radius-sm); font-size: 0.95rem; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary-hover); background: var(--primary-light); }
        .nav-cta-group { display: flex; align-items: center; gap: 1rem; }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.85rem 1.6rem; border-radius: var(--radius-sm); font-weight: 600; transition: var(--transition); font-size: 0.95rem; cursor: pointer; border: none; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn-outline { border: 2px solid var(--border); color: var(--text-primary); background: transparent; }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary-hover); background: var(--primary-light); }

        .mobile-menu-btn { display: none; background: none; border: none; cursor: pointer; padding: 0.5rem; }
        .mobile-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 999; opacity: 0; visibility: hidden; transition: var(--transition); }
        .mobile-overlay.active { opacity: 1; visibility: visible; }
        .mobile-nav { position: fixed; top: 0; right: -100%; width: 80%; max-width: 320px; height: 100vh; background: var(--surface); z-index: 1001; padding: 2rem 1.5rem; transition: var(--transition); box-shadow: var(--shadow-md); overflow-y: auto; }
        .mobile-nav.active { right: 0; }
        .mobile-nav a { display: block; padding: 1rem 0; border-bottom: 1px solid var(--border); color: var(--text-primary); font-weight: 500; }
        .close-mobile { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-secondary); }

        /* Page Hero */
        .page-hero { background: var(--surface); padding: 3rem 0 2rem; border-bottom: 1px solid var(--border); margin-bottom: 3rem; }
        .page-hero h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        .page-hero p { color: var(--text-secondary); font-size: 1.1rem; }

        /* Timeline Styles */
        .timeline { position: relative; padding: 2rem 0; margin-left: 1rem; }
        .timeline::before { content: ''; position: absolute; left: 24px; top: 0; bottom: 0; width: 2px; background: var(--border); }
        
        .timeline-item { position: relative; margin-bottom: 2.5rem; padding-left: 60px; }
        .timeline-marker { position: absolute; left: 15px; top: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); border: 2px solid var(--primary); z-index: 2; display: flex; align-items: center; justify-content: center; color: var(--primary); }
        .timeline-marker.rx { border-color: #f59e0b; color: #f59e0b; }
        
        .timeline-content { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1.5rem; box-shadow: var(--shadow-sm); transition: var(--transition); }
        .timeline-content:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        
        .event-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
        .event-date { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
        .event-badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; background: var(--primary-light); color: var(--primary-hover); }
        .event-badge.rx { background: #fffbeb; color: #f59e0b; }
        
        .event-body h3 { font-size: 1.1rem; margin-bottom: 0.25rem; color: var(--text-primary); }
        .event-body p { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 0.5rem; }
        .event-details { background: var(--bg-main); padding: 1rem; border-radius: var(--radius-sm); margin-top: 1rem; font-size: 0.9rem; }
        .event-details strong { color: var(--text-primary); }

        /* Empty State */
        .empty-state { text-align: center; padding: 4rem 2rem; background: var(--surface); border-radius: var(--radius-lg); border: 1px dashed var(--border); }
        .empty-state svg { margin: 0 auto 1.5rem auto; color: var(--text-secondary); }
        .empty-state h3 { font-size: 1.25rem; margin-bottom: 0.5rem; }
        .empty-state p { color: var(--text-secondary); margin-bottom: 2rem; }

        @media (max-width: 900px) {
            .nav-links { display: none; }
            .mobile-menu-btn { display: block; }
        }
    </style>
</head>
<body>

        <div class="container navbar">
            <a href="index.html" class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>
                MediCare<span>+</span>
            </a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="doctor.html">Doctors</a>
                <a href="appointments.html">Appointments</a>
                <a href="presciption.html">Prescriptions</a>
                <a href="medreminder.html">Medications</a>
                <a href="medhistory.html" class="active">History</a>
                <a href="security.html">Security</a>
            </nav>
            <div class="nav-cta-group">
                <a href="dashboard.html" class="btn btn-outline">Dashboard</a>
                <button class="mobile-menu-btn" onclick="toggleMobileMenu(true)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
            </div>
        </div>
    </header>

    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleMobileMenu(false)"></div>
    <nav class="mobile-nav" id="mobileNav">
        <button class="close-mobile" onclick="toggleMobileMenu(false)">&times;</button>
        <a href="index.html">Home</a>
        <a href="doctor.html">Doctors</a>
        <a href="appointments.html">Appointments</a>
        <a href="presciption.html">Prescriptions</a>
        <a href="medreminder.html">Medications</a>
        <a href="medhistory.html">History</a>
    </nav>

    <section class="page-hero">
        <div class="container">
            <h1>Medical History</h1>
            <p>View your past appointments, consultations, and prescribed treatments in one chronological timeline.</p>
        </div>
    </section>

    <main>
        <div class="container">
            <div class="timeline" id="timeline-container">
                <!-- JS will populate timeline items here -->
            </div>
        </div>
    </main>

    <script>
        function toggleMobileMenu(open) {
            document.getElementById('mobileNav').classList.toggle('active', open);
            document.getElementById('mobileOverlay').classList.toggle('active', open);
        }

        function renderHistory() {
            const container = document.getElementById('timeline-container');
            
            // Fetch Data from Mock DB
            const appointments = JSON.parse(localStorage.getItem('medicare_appointments') || '[]');
            const prescriptions = JSON.parse(localStorage.getItem('medicare_prescriptions') || '[]');
            
            let events = [];

            // Format Appointments
            appointments.forEach(appt => {
                events.push({
                    type: 'appointment',
                    dateStr: appt.date, // Assuming format "Sep 18, 2026"
                    sortDate: new Date(appt.date).getTime() || 0,
                    content: `
                        <div class="event-header">
                            <span class="event-date">${appt.date}</span>
                            <span class="event-badge">Consultation</span>
                        </div>
                        <div class="event-body">
                            <h3>${appt.doctor}</h3>
                            <p>${appt.spec} at ${appt.hospital}</p>
                            <p>Time: ${appt.time}</p>
                            <div class="event-details">
                                <strong>Reason for Visit:</strong> ${appt.reason || 'Not specified'}<br>
                                <strong>Status:</strong> ${appt.status}
                            </div>
                        </div>
                    `
                });
            });

            // Format Prescriptions
            prescriptions.forEach(rx => {
                const medNames = rx.medicines.map(m => `${m.name} (${m.dosage})`).join(', ');
                events.push({
                    type: 'prescription',
                    dateStr: rx.date,
                    sortDate: new Date(rx.date).getTime() || 0,
                    content: `
                        <div class="event-header">
                            <span class="event-date">${rx.date}</span>
                            <span class="event-badge rx">Prescription</span>
                        </div>
                        <div class="event-body">
                            <h3>${rx.doctorName}</h3>
                            <p>Issued for: ${rx.patientName}</p>
                            <div class="event-details">
                                <strong>Medications:</strong> ${medNames}<br>
                                <strong>Notes:</strong> ${rx.notes || 'No additional notes'}
                            </div>
                        </div>
                    `
                });
            });

            // If empty, show Empty State
            if (events.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6"/><path d="M12 2 8 6"/><path d="M12 2 16 6"/><path d="M12 2v20"/></svg>
                        <h3>No Medical History Yet</h3>
                        <p>Your past appointments and prescriptions will appear here automatically.</p>
                    </div>
                `;
                return;
            }

            // Sort by date descending (newest first)
            events.sort((a, b) => b.sortDate - a.sortDate);

            // Render Timeline
            container.innerHTML = '';
            events.forEach(event => {
                const item = document.createElement('div');
                item.className = 'timeline-item';
                
                const icon = event.type === 'appointment' 
                    ? `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><rect x="3" y="4" width="18" height="18" rx="2"/></svg>`
                    : `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>`;

                item.innerHTML = `
                    <div class="timeline-marker ${event.type === 'prescription' ? 'rx' : ''}">${icon}</div>
                    <div class="timeline-content">${event.content}</div>
                `;
                container.appendChild(item);
            });
        }

        document.addEventListener('DOMContentLoaded', renderHistory);
    </script>
